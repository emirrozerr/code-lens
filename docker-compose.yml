services:
  neo4j:
    image: neo4j:5-community
    container_name: codelens-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"    # Browser UI
      - "${NEO4J_BOLT_PORT:-7687}:7687"    # Bolt protocol (driver)
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-codelens_dev}"
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build: .
    container_name: codelens-api
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-codelens_dev}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change_me_to_a_random_secret}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRY_MINUTES=${JWT_EXPIRY_MINUTES:-1440}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - .:/app
    command: codelens api --host 0.0.0.0 --port 8000
    restart: unless-stopped

  # MCP server runs on stdio by default (used by AI clients like Claude Desktop).
  # Uncomment below to also expose it over SSE on port 8001.
  #
  # mcp-server:
  #   build: .
  #   container_name: codelens-mcp
  #   ports:
  #     - "8001:8001"
  #   environment:
  #     - NEO4J_URI=bolt://neo4j:7687
  #     - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
  #     - NEO4J_PASSWORD=${NEO4J_PASSWORD:-codelens_dev}
  #   depends_on:
  #     neo4j:
  #       condition: service_healthy
  #   volumes:
  #     - .:/app
  #   command: codelens mcp --transport sse --host 0.0.0.0 --port 8001

volumes:
  neo4j_data:
  neo4j_logs:
